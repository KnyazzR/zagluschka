<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="card">
        <div class="logo">✦</div>
        <h1>Добро пожаловать</h1>
        <p class="subtitle">Введите ваш персональный код для продолжения</p>

        <form id="authForm">
            <div class="input-group">
                <input type="text" id="userId" placeholder="Ваш код доступа" autocomplete="off" autofocus required>
            </div>
            <button type="submit" class="btn" id="submitBtn">
                <span class="btn-text">Войти</span>
                <span class="spinner"></span>
            </button>
        </form>

        <div class="message" id="message"></div>

        <div class="footer">
            Нужна помощь? <a href="#">Связаться с поддержкой</a>
        </div>
    </div>

    <script>
        // 🔧 Чтение cookie
        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? match[2] : null;
        }

        // 🚀 Авто-редирект при загрузке, если куки есть
        window.addEventListener('DOMContentLoaded', () => {
            const savedRoute = getCookie('user_redirect_route');
            if (savedRoute) {
                window.location.href = savedRoute;
            }
        });

        const form = document.getElementById('authForm');
        const input = document.getElementById('userId');
        const btn = document.getElementById('submitBtn');
        const message = document.getElementById('message');

        function showMessage(text) {
            message.textContent = text;
            message.className = 'message active error';
        }

        function hideMessage() {
            message.className = 'message';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const value = input.value.trim();

            if (!value) {
                showMessage('Пожалуйста, введите код');
                return;
            }

            hideMessage();
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const res = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input: value })
                });

                const data = await res.json();

                if (res.ok && data.redirect) {
                    window.location.href = data.redirect;
                } else {
                    showMessage(data.detail || data.error || 'Неверный код доступа');
                }
            } catch (err) {
                showMessage('Ошибка соединения. Попробуйте позже.');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
