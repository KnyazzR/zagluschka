<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #f8fafc;
        }
        .card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 1.5rem;
            width: 90%;
            max-width: 420px;
            text-align: center;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        input {
            width: 100%;
            padding: 1rem;
            border-radius: 0.75rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: #f8fafc;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #38bdf8; }
        .error {
            margin-top: 1rem;
            color: #f87171;
            font-size: 0.9rem;
            min-height: 1.2em;
        }
        .spinner {
            display: none;
            margin: 1rem auto 0;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <h1>Введите ваш идентификатор</h1>
        <input type="text" id="userId" placeholder="Ваш код доступа..." autocomplete="off" autofocus>
        <div class="spinner" id="spinner"></div>
        <div class="error" id="error"></div>
    </div>

    <script>
        const input = document.getElementById('userId');
        const errorEl = document.getElementById('error');
        const spinner = document.getElementById('spinner');

        async function checkUser(value) {
            errorEl.textContent = '';
            spinner.style.display = 'block';

            try {
                const res = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input: value })
                });

                const data = await res.json();

                if (res.ok && data.redirect) {
                    // Редирект на нужную локацию
                    window.location.href = data.redirect;
                } else {
                    errorEl.textContent = data.error || 'Доступ запрещён';
                }
            } catch (e) {
                errorEl.textContent = 'Ошибка соединения с сервером';
            } finally {
                spinner.style.display = 'none';
            }
        }

        // Отправка по Enter
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = input.value.trim();
                if (val) checkUser(val);
            }
        });
    </script>
</body>
</html>
