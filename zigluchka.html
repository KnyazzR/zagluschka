<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная заглушка</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.6);
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text-main);
            overflow: hidden;
        }

        /* Фоновые декоративные круги */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            z-index: 0;
        }
        .circle-1 { width: 300px; height: 300px; background: #38bdf8; top: -50px; left: -50px; }
        .circle-2 { width: 400px; height: 400px; background: #818cf8; bottom: -100px; right: -100px; }

        .card {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2.5rem;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 480px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }

        input {
            width: 100%;
            padding: 1rem 1.25rem;
            border-radius: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-main);
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            background: rgba(0, 0, 0, 0.3);
        }

        .hint {
            font-size: 0.9rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 0.75rem;
            border-radius: 0.75rem;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .message {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 1rem;
            font-weight: 600;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
            height: 0;
            overflow: hidden;
        }

        .message.active {
            opacity: 1;
            transform: translateY(0);
            height: auto;
            padding: 1rem;
            margin-top: 1.5rem;
        }

        .message.success {
            background: rgba(74, 222, 128, 0.1);
            color: var(--success);
            border: 1px solid rgba(74, 222, 128, 0.3);
        }
        
        .message.easter-egg {
            background: rgba(250, 204, 21, 0.1);
            color: #facc15;
            border: 1px solid rgba(250, 204, 21, 0.3);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>

    <div class="card">
        <h1>Интерактивное поле ввода</h1>
        <p class="subtitle">Введите текст для проверки системы</p>
        
        <div class="input-wrapper">
            <input type="text" id="magicInput" placeholder="Начните печатать..." autocomplete="off">
        </div>
        
        <p class="hint">💡 Подсказка: попробуйте ввести «п» или «майкл джексон»</p>
        
        <div id="result" class="message"></div>
    </div>

    <script>
        const input = document.getElementById('magicInput');
        const result = document.getElementById('result');

        input.addEventListener('input', (e) => {
            const val = e.target.value.trim().toLowerCase();
            
            result.classList.remove('active', 'success', 'easter-egg');

            if (val === '') {
                return;
            } else if (val === 'п') {
                result.textContent = '✅ Верно! Это буква «п».';
                result.classList.add('active', 'success');
            } else if (val.includes('майкл джексон')) {
                result.textContent = '🌕🚶‍♂️✨ Hee-hee! Вы нашли пасхалку!';
                result.classList.add('active', 'easter-egg');
            } else {
                result.textContent = '🤔 Интересный ввод, но попробуйте подсказку...';
                result.classList.add('active', 'success');
            }
        });
    </script>
</body>
</html>
